{% extends "base.html" %}
{% block title %}Вход — MAX Repost{% endblock %}
{% block body %}
<section class="login-page">
  <div class="login">
    <div class="brand-mark">MAX Repost</div>
    <h1>Вход в панель</h1>
    <p class="muted">Каналы, источники и очередь публикаций</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="card-form" style="margin-top:20px">
      <label>Логин
        <input name="login" autocomplete="username" required autofocus />
      </label>
      <label>Пароль
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Войти</button>
    </form>
  </div>
</section>
{% endblock %}
