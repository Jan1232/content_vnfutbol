<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MAX Repost{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/admin.css?v=11" />
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
  <script>
    (function () {
      var modal = document.getElementById("vk-modal");
      var openBtn = document.getElementById("vk-open");
      var closeBtn = document.getElementById("vk-close");
      if (modal && openBtn) {
        openBtn.addEventListener("click", function () { modal.showModal(); });
        if (closeBtn) closeBtn.addEventListener("click", function () { modal.close(); });
      }
      var saveForm = document.getElementById("media-filter-save");
      if (saveForm) {
        saveForm.addEventListener("submit", function () {
          saveForm.querySelectorAll("input[data-generated]").forEach(function (n) { n.remove(); });
          document.querySelectorAll(".js-require-media").forEach(function (cb) {
            var hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "item";
            hidden.value = cb.getAttribute("data-chat-id") + ":" + (cb.checked ? "1" : "0");
            hidden.setAttribute("data-generated", "1");
            saveForm.appendChild(hidden);
          });
          document.querySelectorAll(".js-require-text").forEach(function (cb) {
            var hidden = document.createElement("input");
            hidden.type = "hidden";
            hidden.name = "text_item";
            hidden.value = cb.getAttribute("data-chat-id") + ":" + (cb.checked ? "1" : "0");
            hidden.setAttribute("data-generated", "1");
            saveForm.appendChild(hidden);
          });
        });
      }
    })();
  </script>
</body>
</html>
