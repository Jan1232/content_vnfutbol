# Ядро правил MAX Repost — применяется ко ВСЕМ каналам.
# Особые каналы / группы ВК: rules/channels/<slug>.yaml (дополняет / переопределяет ядро).
# Для ВК в оверрайде укажите chat_id = −id группы и/или link_contains: vk.com/<screen>.

# strip — ссылки и CTA-хвосты вырезаются при публикации (не блокируют пост сами по себе).
# strict — любой URL в тексте = блок (почти не нужен; оставляем на случай оверрайда).
moderation_mode: strip

# Публиковать только посты с фото/видео.
require_media: true

# Строки-концовки после вырезания ссылок (городские СМИ и аналоги).
strip_line_contains:
  - прислать новость в max
  - читайте нас в max
  - подписаться | прислать новость
  - подписаться| прислать новость
  - предложить новость
  - предложи новость
  - прислать материал
  - мы в max
  - канал в max
  - канал в мах
  - канал в телеграм
  - канале в max
  - подписаться на новости
  - подпишись на
  - сообщи свою новость
  - максимум новостей
  - дублируем новости
  - тг замедлили
  - не грузится телеграмм
  - не грузит медиа
  - здесь мы всегда на связи
  - легендарный 24
  - дарим бензин нашим подписчикам
  - дарим бензин
  - дарим билеты
  - заправка за наш счёт
  - бесплатные билеты на концерт тут

# Что делает ядро (логика в app/filter.py):
# - удаление ссылок, голых доменов, CTA-кнопок
# - вырезание хвостов: «в MAX», Telegram, «подробнее тут», «читайте тут» и т.п.
# - вырезание «Прислать новость в MAX / Читайте нас в MAX / Подписаться | Прислать новость»
# - блок рекламы / капперов / донатов / розыгрышей
# - блок ЕГЭ/ОГЭ/VPN/вузы/курсы/вакансии/удалёнки/казино/«по ссылке»
# - блок постов про трансляции: «трансляция», «смотреть онлайн», «смотреть тут»…
# - блок урезанных preview t.me/s (~256 символов + «…») — копии полного поста
