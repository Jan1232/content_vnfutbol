# ============================================================
# rules_content.yaml — правила отбора контента для editorial-модели
# Выведены из 2 кругов ручной разметки (пулы 10d / 14d).
# Редактируется без изменения кода: content_filter.py читает отсюда.
#
# Порядок применения (в content_filter.decide):
#   0. service/junk        -> reject
#   1. topic gate (football_only) -> off_topic  (см. topic_gate.py)
#   2. human_factor (не реакция)  -> take
#   3. reaction (без bright_quote) -> reject     <-- главный источник ложных take
#   4. rpl gate            -> take только по исключениям
#   5. rumor               -> reject (allow_rumors=false)
#   6. match_result soft-ban -> take только при нарративе
#   7. friendly (без нарратива) -> reject
#   8. transfer/money | top_name | sensation | bright_quote -> take
#   9. dedup (event/addition/repeat)
#  10. human_factor cap <= 40% of take
# ============================================================

