                   Лига Европы, Лиги Европы, Europa League, Суперкубок, Super Cup]

money_markers: ["€", млн евро, "млн €", зарплат, оклад, зарабатыв, стоимост, млн фунтов, "£"]

# ---------- регэкспы (Python re, IGNORECASE) ----------
patterns:

  # служебные/сводки/трансляции — reject
  service: >-
    расписание|результаты матчей|календарь, таблица|по футболу на \d|preview no|
    football daily|football weekly|gossip|обзор тура|где смотреть|анонс дня|
    видеообзор|таблица$|смотреть онлайн|прямую трансляцию|видеотрансляции|Начало прямой|
    и другие новости|новости дня|дайджест|хроника дня|что произошло|кратко о главном|
    главные новости|сводка новост

  # вторичные реакции/мнения — reject (если нет event-глагола и bright_quote)
  reaction: >-
    отреагировал|оценил|высказал(ся)?|прокомментир|ответил на слух|заступил|
    о слух(ах|и)|о возможном|удивл|обратился к|сравнил|объяснил, почему|
    рассказал, как|о желании|признался|заявил, что|считает, что

  # глагол реального события — если есть, реакция НЕ срабатывает
  event_verb: >-
    перешёл|перешел|подписал|объявил о переходе|купил|продал|арендовал|забил|
    дубль|хет-трик|покер|разгромил|уволен|возглавил|продлил контракт|представил|
    медосмотр|согласовал|перейд[ёе]т|за \d+.*млн|€|£

  # нарративные крючки для match_result (soft-ban исключения)
  narrative_achievement: >-
    \b\d+[-\s]?(й|го|м)?\s*(трофей|кубок|титул)|раз подряд|подряд\b|рекорд|
    самый быстрый|впервые с \d{4}|впервые за \d+|первым?\s+за\s+\d+|серия из|
    без поражени|\d+ матчей подряд|установил рекорд|историческ|в \d+-й раз|
    дубль|хет-трик|покер
  narrative_sensation: >-
    сенсац|разгром|обыграл.*(Реал|Барс|Сити|Бавари|ПСЖ|Зенит|гранд)|
    победа над «(Зенит|Реал|Барс|Сити|Бавари|ПСЖ)|аутсайдер|неожида
  narrative_drama: >-
    камбэк|отыгрались|с 0:\d|удал[ёе]н|красн(ая|ую) карт|скандал|потасовк|
    драк|стычк|отменил гол|VAR|послематчев|не реализовал.*пенальти
  narrative_individual: >-
    забил (первый|дебютный|самый)|первый гол за|дебютн.*гол|гол.*за \d+ (секунд|минут)|
    промах|не реализовал три пенальти
  narrative_trophy: >-
    Суперкубок|финал|трофей|вылет|выиграл кубок|взял.*кубок|
    взял.*Суперкубок|оформил чемпионство

  # голый счёт / результат без нарратива -> контур результатов
  bare_result: >-
    \d+:\d+|обзор тур|результаты дня|
    победил|обыграл|уступил|проиграл|сыграл|разгромил|ничья

  # предсезонные товарняки без нарратива — низкая ценность, reject
  friendly: >-
    товарищеск|контрольн(ый|ом) матч|сборную .*лиги|стартовые составы|
    покажут .*матч

  # маркеры "дополнения к событию" (не повтор) в дедупе
  addition: >-
    аэропорт|встрет|фанат|болельщик|презентац|дебют|раздевалк|брачный|
    стоимост|зарплат|оклад|€|млн|контракт до|медосмотр|видео|номер|договор

  # lifestyle / человеческий фактор
  # NB: узкие однозначные токены. Широкие (раздевалк, жен*, кот*, день рождения)
  # убраны — цепляли «в раздевалке» в счёте, «женщина-судья», «в день рождения».
  human_factor: >-
    свадьб|мем\b|прическ|причёск|ковбойск|диджей|пошутил|нелеп|курьёз|курьез|
    на отдыхе|кроссовк|порше|mercedes-benz|татуировк|особняк за|
    брачный (договор|контракт)|родился (сын|ребёнок|дочь)|сменил имидж|
    перекрасил|новая причёска|засветил|попал на видео с

  # сильный lifestyle (перебивает reaction в human-корзине)
  human_strong: >-
    свадьб|подрал|напал|mercedes-benz|порше|кроссовк|татуировк|особняк за|
    ковбойск|брачный (договор|контракт)|родился (сын|ребёнок|дочь)|
    сменил имидж|перекрасил

  # yes-паттерн: реальный трансфер/деньги
  transfer: >-
    перех|трансфер|подпис|аренд|предложил|купил|продал|контракт|представил|
    презентац|медосмотр|согласовал

  # яркая цитата (скандальная/эмоциональная)
  bright_quote_flavor: >-
    нельзя дел|лжешь|ложь|позор|унизит|смешн|обнял|100%|никогда|
    ненавиж|боишься|респект|величайш|деньги

# ---------- donor gate (HOTFIX-2): реклама → reject ----------
donor_gate:
  gate_version: 2
  ad_patterns: >-
    ставк|букмекер|букмек|казино|1xbet|1хбет|фонбет|fonbet|pari|пари|melbet|мелбет|
    winline|винлайн|промокод|промо-код|реф\.?\s*ссыл|партнёрск|партнерск|
    переходи по ссылке|по ссылке в био|#ad\b|спонсор|азартн|
    видео прогноз|ставлю на матч|экспресс дня|бесплатн.*прогноз|промо\b
  ad_markers:
    - "ставлю на матч"
    - "букмекер"
    - "промокод"
    - "казино"

# ---------- параметры ----------
params:
  human_factor_cap: 0.40        # доля human_factor среди take (§2B п.4)
  dedup_min_novel_tokens: 3     # сколько новых токенов делают запись "дополнением"
  rpl_topmatch_min_grands: 2    # результат топ-матча РПЛ: минимум грандов в заголовке
  factcheck_min_sources: 2      # см. §3 (health/injury -> 3, задаётся в config)

# ---------- РПЛ-исключения (единственное, что проходит из РПЛ) ----------
rpl_exceptions:
  referee_incident: true        # удаление/красная/отменённый гол/драка в матче гранда
  ru_player_to_europe: true     # переход РФ-игрока из ru_export_names в евроклуб
  top_match_narrative: true     # результат матча >=2 грандов ТОЛЬКО с нарративом
  cup_semifinal_plus: true      # Кубок России с полуфинала
