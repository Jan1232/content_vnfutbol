# CTA, брендинг доноров и текстовые ватермарки — удаляются light_edit (§1.2).
patterns:
  - "(?i)подписывайтесь?\\s+на\\s+(?:наш\\s+)?канал"
  - "(?i)подписывайся\\s+на\\s+(?:наш\\s+)?канал"
  - "(?i)наш\\s+канал\\s*[:—-]?"
  - "(?i)ставь\\s+реакци[юи]"
  - "(?i)пиши\\s+в\\s+коммент"
  - "(?i)жми\\s+(?:на\\s+)?(?:кнопку|ссылку)"
  - "(?i)переходи\\s+по\\s+ссылке"
  - "(?i)источник\\s*:"
  - "(?i)читай\\s+в\\s+нашем\\s+канале"
  - "(?i)больше\\s+новостей\\s+в"
  - "(?i)следите\\s+за\\s+новостями"
  - "(?i)не\\s+забудьте\\s+подписаться"
  - "(?i)репост\\s+приветствуется"
  - "(?i)прислать\\s+новость"
  - "(?i)реклама\\s*:"
  - "(?i)партнёрский\\s+материал"

strings:
  - "Жизнь Футбол"
  - "SoccerBlog"
  - "soccerblog"
  - "Футбол 24"
  - "Спорт-Экспресс"
  - "Чемпионат"
  - "Sports.ru"
